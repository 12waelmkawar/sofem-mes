version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sofem-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sofem_mes
      POSTGRES_USER: sofem_user
      POSTGRES_PASSWORD: sofem_password_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend-ts/db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sofem_user -d sofem_mes"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - sofem-network

  redis:
    image: redis:7-alpine
    container_name: sofem-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sofem-network
    profiles:
      - optional

  backend:
    build:
      context: ./backend-ts
      dockerfile: Dockerfile.dev
    container_name: sofem-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 8000
      DATABASE_URL: postgresql://sofem_user:sofem_password_dev@postgres:5432/sofem_mes
      JWT_SECRET: dev-secret-change-in-production
      JWT_EXPIRES_IN: 24h
      SERVE_FRONTEND: "false"
    ports:
      - "8000:8000"
    volumes:
      - ./backend-ts:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sofem-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: sofem-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - sofem-network

volumes:
  postgres_data:
  redis_data:
  backend_node_modules:
  frontend_node_modules:

networks:
  sofem-network:
    driver: bridge
